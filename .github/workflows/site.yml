# Publishes the promo site (site/) to GitHub Pages on each push to main that changes it or the README's screenshots,
# which it shows: docs/images (`make screenshots`) and docs/brand are copied in beside it, so a new screenshot reaches
# the site without a second copy in the repository.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'docs/brand/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put the site together
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R docs/images _site/images
          cp -R docs/brand _site/brand
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
